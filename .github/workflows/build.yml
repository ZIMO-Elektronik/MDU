name: build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  arm-none-eabi-gcc:
    uses: ZIMO-Elektronik/.github-workflows/.github/workflows/arm-none-eabi-gcc.yml@v0.4.0
    with:
      arch: -mcpu=cortex-m4
      target: MDU

  esp-elf-gcc:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        esp_idf_version: [latest, v6.1, v6.0.3, v5.5.5, v5.4.4]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: espressif/esp-idf-ci-action@v1
        with:
          path: examples/esp32
          esp_idf_version: ${{ matrix.esp_idf_version }}
          target: esp32

  x86_64-linux-gnu-gcc:
    uses: ZIMO-Elektronik/.github-workflows/.github/workflows/x86_64-linux-gnu-gcc.yml@v0.4.0
